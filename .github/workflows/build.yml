name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -Evi 'beta|release_candidate|_rc' | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install VLC (CocoaPods)
        run: |
          which pod || sudo gem install cocoapods
          pod install

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep 'MARKETING_VERSION' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Fire.xcworkspace \
            -scheme Fire \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log || {
              # Show the compile errors as annotations, so they're easy to see.
              grep -E "error:" build.log | sort -u | head -20 | while IFS= read -r line; do
                echo "::error::${line}"
              done
              exit 1
            }

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Fire.app Payload/
          zip -qr Fire.ipa Payload
          ls -la Fire.ipa

      - name: Upload IPA (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Fire-ipa
          path: Fire.ipa

      - name: Release notes from CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="$VERSION" '/^## /{ if (f) exit; split($0, a, " "); if (a[2] == v) f = 1; next } f' CHANGELOG.md > notes.md
          printf '\n---\nDownload **Fire.ipa** below and install it with your signing app (Signulous, AltStore, Sideloadly). iPhone and iPad, iOS 16 or later.\n' >> notes.md
          cat notes.md

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: FIRE ${{ steps.version.outputs.version }}
          body_path: notes.md
          files: Fire.ipa
          make_latest: true
